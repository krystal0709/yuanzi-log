<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>园子日志</title>
<meta name="description" content="园子的个人工作台：记账、待办、体重、英语学习日志">
<!-- 部署标记：2026-07-29 更新默认首页为「记账」，部署至腾讯云 COS（香港）+ GitHub 镜像 -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="园子日志">
<meta name="theme-color" content="#5B8C5A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --green:#5B8C5A; --green-dark:#477046; --green-light:#EAF3EA;
  --bg:#F6F8F4; --card:#ffffff; --text:#2b3a2b; --sub:#8a978a;
  --amber:#E8A33D; --blue:#4A7FB5; --rose:#C96B6B; --violet:#8B6FB5;
  --radius:18px; --shadow:0 4px 14px rgba(80,110,90,.08);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.topbar{position:sticky;top:0;z-index:20;background:rgba(247,248,246,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--safe-t) + 12px) 20px 10px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.topbar .date{font-size:13px;color:var(--sub)}
main{flex:1;padding:4px 16px calc(96px + var(--safe-b))}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 底部导航 */
nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #eceeeb;display:flex;max-width:560px;margin:0 auto;padding:6px 4px calc(6px + var(--safe-b))}
.tabbar button{flex:1;background:none;border:none;font-size:10.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;position:relative}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--green);font-weight:600}
.tabbar .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--rose);display:none}
.tabbar .dot.show{display:block}

/* 卡片与通用 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;transition:transform .15s ease}
.stat:active{transform:scale(.97)}
.stat .lb{font-size:12px;color:var(--sub)}
.stat .vl{font-size:20px;font-weight:700;margin-top:2px}
.section-title{font-size:14px;font-weight:600;color:var(--sub);margin:16px 4px 8px}

/* 输入区 */
.input-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:14px}
.input-row{display:flex;gap:8px;align-items:center}
.input-row input[type=text],.input-row input[type=number]{flex:1;border:1.5px solid #e3e7e1;border-radius:12px;padding:11px 12px;font-size:16px;background:#fbfcfa;outline:none;min-width:0}
.input-row input:focus{border-color:var(--green)}
.btn-mic,.btn-add{width:44px;height:44px;border-radius:12px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.btn-mic{background:var(--green-light);color:var(--green)}
.btn-mic.rec{background:var(--rose);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.btn-add{background:var(--green);color:#fff;font-size:24px;font-weight:300;transition:transform .12s ease,filter .2s ease}
.btn-add:active{transform:scale(.9);filter:brightness(1.08)}
.btn-mic:active{transform:scale(.9)}
.btn-mic svg{width:22px;height:22px;fill:currentColor}
.hint{font-size:11.5px;color:var(--sub);margin-top:8px;padding:0 2px;line-height:1.5}
.hint.listening{color:var(--rose);font-weight:600}
.amount-row{margin-top:8px}
.date-pick{display:flex;align-items:center;gap:8px;margin-top:8px}
.date-pick label{font-size:12.5px;color:var(--sub)}
.date-pick input{border:1.5px solid #e3e7e1;border-radius:10px;padding:6px 10px;font-size:14px;background:#fbfcfa;color:var(--text);font-family:inherit}

/* 列表 */
.day-group{margin-bottom:14px}
.day-head{font-size:13px;font-weight:600;color:var(--sub);margin:0 4px 6px;display:flex;justify-content:space-between}
.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.item:active{background:#fbfdfb}
.item .txt{flex:1;font-size:15px;line-height:1.45;word-break:break-all}
.item .meta{font-size:12px;color:var(--sub);margin-top:2px}
.item .amt{font-weight:700;font-size:16px;color:var(--rose);flex:0 0 auto}
.item .kg{font-weight:700;font-size:16px;color:var(--blue);flex:0 0 auto}
.item .del{border:none;background:none;color:#c9d0c8;font-size:18px;padding:6px;cursor:pointer;flex:0 0 auto}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #cfd8ce;background:none;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:transform .15s ease}
.chk:active{transform:scale(.82)}
.chk.done{background:var(--green);border-color:var(--green)}
.item.done .txt{text-decoration:line-through;color:var(--sub)}
.empty{text-align:center;color:#b7c1b6;font-size:14px;padding:36px 0}
.empty .big{font-size:34px;margin-bottom:8px}

/* 周报 */
.report-card{background:linear-gradient(150deg,#6FB36B,#4E8A52);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 8px 22px rgba(91,140,90,.28)}
.report-card h3{font-size:17px;margin-bottom:2px}
.report-card .rng{font-size:12px;opacity:.85;margin-bottom:12px}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-cell{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px}
.rp-cell .l{font-size:11.5px;opacity:.9}
.rp-cell .v{font-size:19px;font-weight:700;margin-top:2px}
.rp-cell .s{font-size:11px;opacity:.85;margin-top:2px}
.report-detail{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;font-size:14px;line-height:1.8}
.report-detail h4{font-size:14px;color:var(--green-dark);margin:10px 0 4px}
.report-detail h4:first-child{margin-top:0}
.report-detail ul{padding-left:18px;color:#4a584a}
.banner{background:#FFF6E5;border:1px solid #F5DFAE;color:#8a6a1f;border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:12px;display:none;line-height:1.5}
.banner.show{display:block}
.wk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wk-nav button{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:10px;width:36px;height:36px;font-size:16px;color:var(--green);cursor:pointer}
.wk-nav button:disabled{opacity:.35}
.wk-nav .t{font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:rgba(43,58,43,.92);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.seg{display:flex;background:#eef1ed;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:8px 0;font-size:13.5px;border-radius:9px;color:var(--sub);cursor:pointer;font-weight:500}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:600}
.chart-wrap{height:140px;margin-top:8px}
canvas{width:100%;height:100%}
.lang-tip{font-size:11px;color:var(--sub);text-align:right;margin-top:4px}
/* 图片识别按钮 */
.btn-cam{width:100%;margin-top:10px;background:var(--green-light);color:var(--green-dark);border:1.5px dashed #bcd9b8;border-radius:12px;padding:11px;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,background .2s ease}
.btn-cam:active{transform:scale(.98);background:#dfeedd}
.btn-cam svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-cam.busy{opacity:.55;pointer-events:none}
.ocr-prev{margin-top:10px;background:#fbfcfa;border:1px solid #e3e7e1;border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--sub);line-height:1.6;display:none;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto}
.ocr-prev.show{display:block}
/* 萌系底部导航与空状态 */
.tabbar button svg{stroke:currentColor}
.tabbar button:active{transform:scale(.93)}
.tabbar button.on svg{filter:drop-shadow(0 2px 3px rgba(91,140,90,.35))}
.empty{padding:30px 0 38px}
.empty svg{width:96px;height:96px;margin:0 auto 8px;display:block}
.empty .big{font-size:13px;color:#9aa897;font-weight:500}

/* 类别标签、折叠、弹层 */
.day-head.clickable{cursor:pointer;user-select:none;transition:opacity .15s}
.day-head.clickable:active{opacity:.6}
.chev{display:inline-block;margin-left:6px;font-size:11px;color:var(--sub);transition:transform .2s}
.cat-badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);flex:0 0 auto;cursor:pointer;white-space:nowrap;transition:transform .12s}
.cat-badge:active{transform:scale(.92)}
.link-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--green);font-size:13px;font-weight:600;padding:4px 2px;cursor:pointer;margin:-4px 0 12px}
.link-btn:active{opacity:.6}
.mask{position:fixed;inset:0;background:rgba(30,40,30,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.show{opacity:1;pointer-events:auto}
.modal{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .28s ease}
.mask.show .modal{transform:none}
.modal-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--sub);text-align:center;margin-bottom:16px}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.modal-btns button{flex:1;border:none;border-radius:14px;padding:13px 0;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s}
.btn-ok{background:var(--green);color:#fff}
.btn-cancel{background:#eef1ed;color:var(--text)}
.btn-ok:active,.btn-cancel:active{transform:scale(.97)}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:5px;background:#f6f8f4;border:2px solid transparent;border-radius:14px;padding:12px 4px;cursor:pointer;transition:border-color .15s,transform .12s}
.cat-opt:active{transform:scale(.95)}
.cat-opt.on{border-color:var(--c)}
.cat-opt .ico{font-size:24px}
.cat-opt .nm{font-size:11.5px;color:var(--text);font-weight:600}
.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.pie-wrap canvas{width:200px;height:200px}
.legend{width:100%;display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend-row .dotc{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend-row .nm{flex:1}
.legend-row .vl{font-weight:600}
.legend-row .pc{color:var(--sub);font-size:12px;min-width:42px;text-align:right}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="pageTitle">园子日志</h1>
    <span class="date" id="todayStr"></span>
  </header>
  <main>
    <div class="banner" id="reportBanner">📊 <b>上周总结已生成！</b>点击底部「周报」查看上周的花费、待办完成情况和体重变化。</div>

    <!-- 记账 -->
    <section class="page" id="pg-money">
      <div class="stat-row">
        <div class="stat"><div class="lb">今日支出</div><div class="vl" id="mToday">¥0</div></div>
        <div class="stat"><div class="lb">本周支出</div><div class="vl" id="mWeek">¥0</div></div>
        <div class="stat"><div class="lb">本月支出</div><div class="vl" id="mMonth">¥0</div></div>
      </div>
      <button class="link-btn" id="mCatBtn">🍩 查看类别明细</button>
      <div class="input-box">
        <div class="input-row">
          <input type="text" id="mNote" placeholder="消费内容，如：午饭 麻辣烫" enterkeyhint="done">
          <button class="btn-mic" data-mic="mNote" aria-label="语音输入"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg></button>
        </div>
        <div class="input-row amount-row">
          <input type="number" id="mAmt" placeholder="金额（元）" inputmode="decimal" step="0.01">
          <button class="btn-add" id="mAdd" aria-label="添加">+</button>
        </div>
        <div class="date-pick"><label>日期</label><input type="date" id="mDate"></div>
        <button class="btn-cam" data-cam="money"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.6"/></svg>📷 图片识别（订单截图自动读物品和价格）</button>
        <input type="file" accept="image/*" hidden data-file="money">
        <div class="ocr-prev" data-prev="money"></div>
        <div class="hint" id="mHint">💡 语音或图片都能录：语音说「午饭麻辣烫25块5」自动识别金额；或传订单截图自动读取</div>
      </div>
      <div id="mList"></div>
    </section>

    <!-- 待办 -->
    <section class="page" id="pg-todo">
      <div class="stat-row">
        <div class="stat"><div class="lb">待完成</div><div class="vl" id="tOpen">0</div></div>
        <div class="stat"><div class="lb">今日完成</div><div class="vl" id="tDoneToday">0</div></div>
        <div class="stat"><div class="lb">本周完成</div><div class="vl" id="tDoneWeek">0</div></div>
      </div>
      <div class="input-box">
        <div class="input-row">
          <input type="text" id="tText" placeholder="要做什么？如：给妈妈打电话" enterkeyhint="done">
          <button class="btn-mic" data-mic="tText" aria-label="语音输入"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg></button>
          <button class="btn-add" id="tAdd" aria-label="添加">+</button>
        </div>
        <div class="date-pick"><label>日期</label><input type="date" id="tDate"></div>
        <button class="btn-cam" data-cam="todo"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.6"/></svg>📷 图片识别（便签/清单截图自动提取文字）</button>
        <input type="file" accept="image/*" hidden data-file="todo">
        <div class="ocr-prev" data-prev="todo"></div>
        <div class="hint" id="tHint"></div>
      </div>
      <div class="seg" id="tSeg">
        <button data-f="open" class="on">进行中</button>
        <button data-f="done">已完成</button>
        <button data-f="all">全部</button>
      </div>
      <div id="tList"></div>
    </section>

    <!-- 体重 -->
    <section class="page" id="pg-weight">
      <div class="stat-row">
        <div class="stat"><div class="lb">最新体重</div><div class="vl" id="wLatest">--</div></div>
        <div class="stat"><div class="lb">本周变化</div><div class="vl" id="wWeekDiff">--</div></div>
        <div class="stat"><div class="lb">30天变化</div><div class="vl" id="wMonthDiff">--</div></div>
      </div>
      <div class="card"><div class="lb" style="font-size:12px;color:var(--sub)">近30天趋势</div><div class="chart-wrap"><canvas id="wChart" width="600" height="280"></canvas></div></div>
      <div class="input-box">
        <div class="input-row">
          <input type="number" id="wKg" placeholder="体重（kg），如 62.5" inputmode="decimal" step="0.1">
          <button class="btn-mic" data-mic="wKg" aria-label="语音输入"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg></button>
          <button class="btn-add" id="wAdd" aria-label="添加">+</button>
        </div>
        <div class="input-row" style="margin-top:8px">
          <input type="text" id="wNote" placeholder="备注（可选），如：晨起空腹">
        </div>
        <div class="date-pick"><label>日期</label><input type="date" id="wDate"></div>
        <button class="btn-cam" data-cam="weight"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.6"/></svg>📷 图片识别（体重秤截图自动读数字）</button>
        <input type="file" accept="image/*" hidden data-file="weight">
        <div class="ocr-prev" data-prev="weight"></div>
        <div class="hint" id="wHint">💡 语音示例：「六十二点五公斤」；或拍体重秤截图自动识别</div>
      </div>
      <div id="wList"></div>
    </section>

    <!-- 英语 -->
    <section class="page" id="pg-english">
      <div class="stat-row">
        <div class="stat"><div class="lb">连续打卡</div><div class="vl" id="eStreak">0天</div></div>
        <div class="stat"><div class="lb">本周学习</div><div class="vl" id="eWeek">0天</div></div>
        <div class="stat"><div class="lb">累计条目</div><div class="vl" id="eTotal">0</div></div>
      </div>
      <div class="input-box">
        <div class="input-row">
          <input type="text" id="eText" placeholder="今天学了什么？单词/句子/心得" enterkeyhint="done">
          <button class="btn-mic" data-mic="eText" aria-label="语音输入"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg></button>
          <button class="btn-add" id="eAdd" aria-label="添加">+</button>
        </div>
        <div class="date-pick"><label>日期</label><input type="date" id="eDate">
          <label style="margin-left:auto"><input type="checkbox" id="eLangEn" style="vertical-align:-2px"> 语音识别英文</label>
        </div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script>
/* ============ 数据层 ============ */
const KEY='yuanzi_log_v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const D=Object.assign({expenses:[],todos:[],weights:[],english:[],reports:{}},load());
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ============ 日期工具 ============ */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmt(new Date());
const WD=['日','一','二','三','四','五','六'];
const prettyDate=s=>{const d=new Date(s+'T00:00:00');const t=today();const y=fmt(new Date(Date.now()-864e5));
  let tag = s===t?'今天':(s===y?'昨天':'');
  return `${s.slice(5).replace('-','月')}日 周${WD[d.getDay()]}${tag?' · '+tag:''}`;};
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x;}
function weekRange(offset){ // offset 0=本周, -1=上周
  const mon=mondayOf(new Date());mon.setDate(mon.getDate()+offset*7);
  const sun=new Date(mon);sun.setDate(sun.getDate()+6);
  return {start:fmt(mon),end:fmt(sun)};
}
const inRange=(s,r)=>s>=r.start&&s<=r.end;

/* ============ 通用 UI ============ */
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('todayStr').textContent=prettyDate(today());
['mDate','tDate','wDate','eDate'].forEach(id=>$(id).value=today());

/* 页面切换 */
const titles={money:'记账本 💰',todo:'待办事项 ✅',weight:'体重记录 ⚖️',english:'英语日志 📖',report:'每周总结 📊'};
document.querySelectorAll('.tabbar button[data-pg]').forEach(b=>b.onclick=()=>switchPage(b.dataset.pg));
function switchPage(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='pg-'+pg));
  document.querySelectorAll('.tabbar button[data-pg]').forEach(b=>b.classList.toggle('on',b.dataset.pg===pg));
  $('pageTitle').textContent=titles[pg]||'园子日志';
  if(pg==='report'){$('rpDot').classList.remove('show');renderReport();}
  window.scrollTo(0,0);
}

/* ============ 语音识别 ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recActive=null;
document.querySelectorAll('.btn-mic').forEach(btn=>{
  btn.onclick=()=>{
    if(!SR){toast('当前浏览器不支持语音识别，请使用键盘听写 🎤');return;}
    if(recActive){recActive.stop();return;}
    const targetId=btn.dataset.mic;
    const rec=new SR();
    rec.lang=(targetId==='eText'&&$('eLangEn').checked)?'en-US':'zh-CN';
    rec.interimResults=true;rec.continuous=false;
    const hintEl=btn.closest('.input-box').querySelector('.hint');
    const oldHint=hintEl?hintEl.textContent:'';
    rec.onstart=()=>{btn.classList.add('rec');recActive=rec;if(hintEl){hintEl.textContent='🔴 正在聆听，请说话…（再点一次停止）';hintEl.classList.add('listening');}};
    rec.onresult=e=>{
      let txt='';for(const r of e.results)txt+=r[0].transcript;
      const el=$(targetId);
      if(el.type==='number'){const n=parseCnNumber(txt);if(n!=null)el.value=n;}
      else{el.value=txt.trim();
        if(targetId==='mNote'){const amt=extractAmount(txt);if(amt!=null&&!$('mAmt').value)$('mAmt').value=amt;}
      }
    };
    rec.onend=()=>{btn.classList.remove('rec');recActive=null;if(hintEl){hintEl.textContent=oldHint;hintEl.classList.remove('listening');}};
    rec.onerror=e=>{if(e.error==='not-allowed')toast('请在设置中允许麦克风权限');else if(e.error!=='aborted')toast('识别失败，请重试');};
    try{rec.start();}catch(e){toast('语音启动失败，请重试');}
  };
});
/* 中文数字/口语金额解析 */
const CN={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'百':100,'千':1000};
function cnToNum(s){
  if(/^[\d.]+$/.test(s))return parseFloat(s);
  let total=0,cur=0,seenUnit=false;
  for(const ch of s){const v=CN[ch];if(v==null)return null;
    if(v>=10){cur=(cur||1)*v;total+=cur;cur=0;seenUnit=true;}else cur=v;}
  total+=cur;return seenUnit||s.length===1?total:parseInt(s.split('').map(c=>CN[c]).join(''))||total;
}
function parseCnNumber(txt){
  const m=txt.match(/(\d+(?:\.\d+)?)/);if(m)return parseFloat(m[1]);
  const m2=txt.replace(/公斤|千克|斤|点/g,s=>s==='点'?'.':'').match(/([零一二两三四五六七八九十百千.]+)/);
  if(m2){const parts=m2[1].split('.');const a=cnToNum(parts[0]);if(a==null)return null;
    if(parts[1]){const dec=parts[1].split('').map(c=>CN[c]??'').join('');return parseFloat(a+'.'+dec);}return a;}
  return null;
}
function extractAmount(txt){
  let m=txt.match(/(\d+(?:\.\d+)?)\s*(?:块|元|钱|kuai)/)||txt.match(/(\d+(?:\.\d+)?)\s*块\s*(\d)/);
  if(m){let v=parseFloat(m[1]);const mao=txt.match(/块\s*(\d)(?!\d)/)||txt.match(/(\d+(?:\.\d+)?)\s*毛/);
    if(mao&&!String(m[1]).includes('.'))v+=parseFloat(mao[1])/10;return v;}
  m=txt.match(/(\d+(?:\.\d+)?)(?!\d)/g);
  return m?parseFloat(m[m.length-1]):null;
}

/* ============ 图片识别（端侧 OCR） ============ */
let ocrBusy=false;
function doOCR(file,cb){
  if(typeof Tesseract==='undefined'){toast('识别引擎加载中，请保持联网稍候');return;}
  if(ocrBusy){toast('正在识别上一张图片…');return;}
  ocrBusy=true;
  toast('🔍 识别中…（首次需下载语言包）');
  Tesseract.recognize(file,'chi_sim+eng',{logger:m=>{}})
    .then(({data})=>cb((data.text||'').trim()))
    .catch(()=>toast('识别失败，可手动输入'))
    .finally(()=>{ocrBusy=false;});
}
function parseReceipt(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let amount=null;
  const sym=text.match(/[¥￥$]\s*(\d+(?:\.\d{1,2})?)/);
  if(sym) amount=parseFloat(sym[1]);
  if(amount==null||isNaN(amount)){
    const nums=(text.match(/\d+(?:\.\d{1,2})?/g)||[]).map(Number).filter(n=>n>0&&n<1000000);
    if(nums.length) amount=Math.max(...nums);
  }
  const descLines=lines.filter(l=>!/^\d+(\.\d+)?$/.test(l)&&/[\u4e00-\u9fa5A-Za-z]/.test(l));
  let desc=descLines.length?descLines.reduce((a,b)=>b.length>a.length?b:a):(lines[0]||'');
  return {amount:(amount!=null&&!isNaN(amount))?Math.round(amount*100)/100:null,desc:desc.replace(/\s+/g,' ').slice(0,40)};
}
function applyOCR(coll,text){
  const prev=document.querySelector(`[data-prev="${coll}"]`);
  if(prev){prev.textContent=text;prev.classList.add('show');}
  if(!text){toast('没识别到文字，换个角度再拍');return;}
  if(coll==='money'){
    const {amount,desc}=parseReceipt(text);
    if(amount!=null&&!$('mAmt').value)$('mAmt').value=amount;
    if(desc&&!$('mNote').value)$('mNote').value=desc;
    toast(`已识别${amount!=null?' ¥'+amount:''}，请确认后保存 ✓`);
  }else if(coll==='todo'){
    const line=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||text;
    $('tText').value=line.slice(0,80);toast('已识别文字，请确认后保存 ✓');
  }else if(coll==='weight'){
    const m=text.replace(/公斤|千克|斤/g,'').match(/[\d.]+/);
    if(m){const n=parseFloat(m[0]);if(n>0&&n<500)$('wKg').value=n;}
    const cn=text.match(/[\u4e00-\u9fa5]{2,}/);if(cn&&!$('wNote').value)$('wNote').value=cn[0].slice(0,20);
    toast('已识别体重，请确认后保存 ✓');
  }else if(coll==='english'){
    $('eText').value=text.replace(/\s+/g,' ').slice(0,200);toast('已识别内容，请确认后保存 ✓');
  }
}
function setCamLoading(coll,on){const b=document.querySelector(`[data-cam="${coll}"]`);if(b)b.classList.toggle('busy',on);}
document.querySelectorAll('[data-cam]').forEach(btn=>{
  const coll=btn.dataset.cam;
  const file=document.querySelector(`[data-file="${coll}"]`);
  btn.onclick=()=>{if(file)file.click();};
  if(file)file.onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    setCamLoading(coll,true);
    doOCR(f,text=>{applyOCR(coll,text);setCamLoading(coll,false);});
    file.value='';
  };
});

/* ============ 费用类别 ============ */
const CATS=[
  {key:'traffic',name:'交通',icon:'🚇',color:'#4A7FB5'},
  {key:'food',name:'吃饭',icon:'🍜',color:'#E8A33D'},
  {key:'shop',name:'购物',icon:'🛍️',color:'#8B6FB5'},
  {key:'beauty',name:'美妆',icon:'💄',color:'#C96B6B'},
  {key:'other',name:'其他',icon:'📦',color:'#8a978a'},
];
const CAT_MAP=Object.fromEntries(CATS.map(c=>[c.key,c]));
const CAT_KEYWORDS={
  beauty:['美妆','化妆','口红','面膜','护肤','香水','粉底','眼影','睫毛','美容','美甲','化妆品','卸妆','精华','防晒','腮红','眉笔','气垫'],
  traffic:['地铁','公交','打车','出租','网约车','滴滴','高铁','火车','飞机','机票','航班','加油','停车','油费','车票','地铁站','轻轨','摩托','单车','顺风车'],
  food:['饭','餐','吃','麻辣烫','午饭','早饭','晚饭','早餐','午餐','晚餐','外卖','咖啡','奶茶','烧烤','火锅','面','粥','餐厅','食堂','零食','水果','菜','鸭','鸡','包','汉堡','披萨','日料','西餐','小吃','夜宵','甜点','蛋糕','面包','下午茶','饮品','宵夜'],
  shop:['淘宝','京东','拼多多','超市','商场','衣服','鞋','包包','数码','手机','家电','家居','日用','杂物','购','商城','便利店','买'],
};
function autoCat(note){
  const s=(note||'');
  for(const k of ['beauty','traffic','food','shop']){
    if(CAT_KEYWORDS[k].some(w=>s.includes(w))) return k;
  }
  return 'other';
}
function expCat(x){return (x.cat&&CAT_MAP[x.cat])?CAT_MAP[x.cat]:CAT_MAP[autoCat(x.note)];}
const round2=n=>Math.round(n*100)/100;

/* ============ 日期分组折叠状态 ============ */
const dayKnown={}, dayCollapsed={};
window.toggleDay=(elId,day)=>{
  if(!dayCollapsed[elId])return;
  if(dayCollapsed[elId].has(day))dayCollapsed[elId].delete(day);else dayCollapsed[elId].add(day);
  if(elId==='mList')renderMoney();else if(elId==='tList')renderTodo();
};

/* ============ 记账模块 ============ */
$('mAdd').onclick=()=>{
  const note=$('mNote').value.trim(),amt=parseFloat($('mAmt').value);
  if(!note&&!amt){toast('请输入消费内容和金额');return;}
  if(isNaN(amt)||amt<=0){toast('请输入有效金额');return;}
  D.expenses.push({id:uid(),date:$('mDate').value||today(),note:note||'未备注',amount:Math.round(amt*100)/100,cat:autoCat(note||'未备注')});
  save();$('mNote').value='';$('mAmt').value='';renderMoney();toast('已记一笔 ¥'+amt);
};
function renderMoney(){
  const t=today(),wk=weekRange(0),mon=t.slice(0,7);
  const sum=a=>a.reduce((s,x)=>s+x.amount,0).toFixed(a.some(x=>x.amount%1)?2:0);
  $('mToday').textContent='¥'+sum(D.expenses.filter(x=>x.date===t));
  $('mWeek').textContent='¥'+sum(D.expenses.filter(x=>inRange(x.date,wk)));
  $('mMonth').textContent='¥'+sum(D.expenses.filter(x=>x.date.slice(0,7)===mon));
  renderDayList('mList',D.expenses,x=>`
    <div class="txt">${esc(x.note)}</div>
    <span class="cat-badge" style="--c:${expCat(x).color}" onclick="editCat('${x.id}')">${expCat(x).icon} ${expCat(x).name}</span>
    <span class="amt">-¥${x.amount}</span>`,'expenses',
    day=>{const s=D.expenses.filter(x=>x.date===day).reduce((a,b)=>a+b.amount,0);return '合计 ¥'+(Math.round(s*100)/100);},
    null,
    {collapsible:true,defaultCollapsed:day=>day!==today()});
}

/* ============ 待办模块 ============ */
let tFilter='open';
$('tSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{tFilter=b.dataset.f;$('tSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderTodo();});
$('tAdd').onclick=()=>{
  const txt=$('tText').value.trim();if(!txt){toast('请输入待办内容');return;}
  D.todos.push({id:uid(),date:$('tDate').value||today(),text:txt,done:false,doneDate:null});
  save();$('tText').value='';renderTodo();toast('已添加待办');
};
function renderTodo(){
  const t=today(),wk=weekRange(0);
  $('tOpen').textContent=D.todos.filter(x=>!x.done).length;
  $('tDoneToday').textContent=D.todos.filter(x=>x.done&&x.doneDate===t).length;
  $('tDoneWeek').textContent=D.todos.filter(x=>x.done&&x.doneDate&&inRange(x.doneDate,wk)).length;
  const list=D.todos.filter(x=>tFilter==='all'?true:tFilter==='done'?x.done:!x.done);
  const todoOpts=(tFilter==='done')?{collapsible:true,defaultCollapsed:day=>day!==today()}:{};
  renderDayList('tList',list,x=>`
    <button class="chk ${x.done?'done':''}" onclick="toggleTodo('${x.id}')">${x.done?'✓':''}</button>
    <div class="txt">${esc(x.text)}${x.done&&x.doneDate?`<div class="meta">完成于 ${x.doneDate.slice(5)}</div>`:''}</div>`,'todos',null,x=>x.done?'done':'',todoOpts);
}
window.toggleTodo=id=>{
  const x=D.todos.find(t=>t.id===id);if(!x)return;
  if(!x.done){
    showConfirm('本项是否已完成？','确认后该待办会标记为已完成',()=>{
      x.done=true;x.doneDate=today();save();renderTodo();toast('🎉 完成一项！');
    });
  }else{
    x.done=false;x.doneDate=null;save();renderTodo();
  }
};

/* ============ 体重模块 ============ */
$('wAdd').onclick=()=>{
  const kg=parseFloat($('wKg').value);
  if(isNaN(kg)||kg<=0||kg>500){toast('请输入有效体重');return;}
  const date=$('wDate').value||today();
  const ex=D.weights.find(x=>x.date===date);
  if(ex){ex.kg=kg;ex.note=$('wNote').value.trim();}
  else D.weights.push({id:uid(),date,kg,note:$('wNote').value.trim()});
  save();$('wKg').value='';$('wNote').value='';renderWeight();toast('已记录 '+kg+' kg');
};
function renderWeight(){
  const ws=[...D.weights].sort((a,b)=>a.date<b.date?-1:1);
  const latest=ws[ws.length-1];
  $('wLatest').textContent=latest?latest.kg+' kg':'--';
  const diff=(arr,days)=>{
    if(!latest)return'--';
    const from=fmt(new Date(Date.now()-days*864e5));
    const base=arr.filter(x=>x.date>=from);
    if(base.length<2)return'--';
    const d=Math.round((base[base.length-1].kg-base[0].kg)*10)/10;
    return (d>0?'+':'')+d+' kg';
  };
  $('wWeekDiff').textContent=diff(ws,7);
  $('wMonthDiff').textContent=diff(ws,30);
  drawWeightChart(ws.filter(x=>x.date>=fmt(new Date(Date.now()-30*864e5))));
  renderDayList('wList',D.weights,x=>`<div class="txt">${esc(x.note||'体重记录')}</div><span class="kg">${x.kg} kg</span>`,'weights');
}
function drawWeightChart(pts){
  const cv=$('wChart'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  if(pts.length<2){ctx.fillStyle='#b7c1b6';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(pts.length?'再记录一次即可显示趋势':'暂无数据',cv.width/2,cv.height/2);return;}
  const P=34,W=cv.width-P*2,H=cv.height-P*2;
  const vals=pts.map(p=>p.kg);let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<1){min-=.5;max+=.5;}
  const X=i=>P+W*i/(pts.length-1),Y=v=>P+H*(1-(v-min)/(max-min));
  ctx.strokeStyle='#5B8C5A';ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(X(i),Y(p.kg)):ctx.moveTo(X(i),Y(p.kg)));ctx.stroke();
  ctx.fillStyle='#5B8C5A';
  pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(X(i),Y(p.kg),4.5,0,7);ctx.fill();});
  ctx.fillStyle='#8a978a';ctx.font='20px sans-serif';ctx.textAlign='center';
  ctx.fillText(pts[0].date.slice(5),X(0)+14,cv.height-6);
  ctx.fillText(pts[pts.length-1].date.slice(5),X(pts.length-1)-14,cv.height-6);
  ctx.fillText(max+'',P-4,P+6);ctx.fillText(min+'',P-4,P+H);
}

const EMPTY_TXT={money:'还没有记账，记下第一笔吧～',todo:'还没有待办，先添加一个小目标？',weight:'还没有体重记录，称一称吧～',english:'还没开始打卡，今天学点什么？'};
function renderDayList(elId,arr,rowFn,coll,headExtra,rowCls,opts){
  const el=$(elId);
  if(!arr.length){
    const key=elId.replace('List','');
    el.innerHTML=`<div class="empty">${EMPTY_ART[key]||EMPTY_ART.money}<div class="big">${EMPTY_TXT[key]||'还没有记录，开始第一条吧'}</div></div>`;
    return;
  }
  const byDay={};arr.forEach(x=>{(byDay[x.date]=byDay[x.date]||[]).push(x);});
  const days=Object.keys(byDay).sort().reverse().slice(0,60);
  const collapsible=!!(opts&&opts.collapsible);
  if(collapsible){
    if(!dayKnown[elId])dayKnown[elId]=new Set();
    if(!dayCollapsed[elId])dayCollapsed[elId]=new Set();
    const known=dayKnown[elId],col=dayCollapsed[elId];
    days.forEach(day=>{if(!known.has(day)){known.add(day);(opts.defaultCollapsed&&opts.defaultCollapsed(day))?col.add(day):col.delete(day);}});
  }
  el.innerHTML=days.map(day=>{
    const isCol=collapsible&&dayCollapsed[elId].has(day);
    const chev=collapsible?`<span class="chev">${isCol?'▸':'▾'}</span>`:'';
    const headCls='day-head'+(collapsible?' clickable':'');
    const headOnclick=collapsible?`onclick="toggleDay('${elId}','${day}')"`:'';
    const items=isCol?'':byDay[day].slice().reverse().map(x=>`
      <div class="item ${rowCls?rowCls(x):''}">${rowFn(x)}
        <button class="del" onclick="delItem('${coll}','${x.id}')">✕</button>
      </div>`).join('');
    return `<div class="day-group">
      <div class="${headCls}" ${headOnclick}><span>${prettyDate(day)}</span><span>${headExtra?headExtra(day):''}${chev}</span></div>
      ${items}
    </div>`;
  }).join('');
}

/* ============ 周报引擎 ============ */
let wkOffset=-1; // 默认看上周
function buildReport(offset){
  const r=weekRange(offset);
  const exp=D.expenses.filter(x=>inRange(x.date,r));
  const total=Math.round(exp.reduce((s,x)=>s+x.amount,0)*100)/100;
  const doneTodos=D.todos.filter(x=>x.done&&x.doneDate&&inRange(x.doneDate,r));
  const newTodos=D.todos.filter(x=>inRange(x.date,r));
  const ws=D.weights.filter(x=>inRange(x.date,r)).sort((a,b)=>a.date<b.date?-1:1);
  const wDiff=ws.length>=2?Math.round((ws[ws.length-1].kg-ws[0].kg)*10)/10:null;
  const eng=D.english.filter(x=>inRange(x.date,r));
  const engDays=[...new Set(eng.map(x=>x.date))].length;
  // 花费 top3
  const top=exp.slice().sort((a,b)=>b.amount-a.amount).slice(0,3);
  return {range:r,total,expCount:exp.length,top,
    doneCount:doneTodos.length,newCount:newTodos.length,doneList:doneTodos.map(x=>x.text),
    wStart:ws[0]?.kg??null,wEnd:ws[ws.length-1]?.kg??null,wDiff,wCount:ws.length,
    engDays,engCount:eng.length,engSample:eng.slice(-3).map(x=>x.text)};
}
function renderReport(){
  const r=buildReport(wkOffset);
  const label=wkOffset===0?'本周（进行中）':wkOffset===-1?'上周':`${-wkOffset}周前`;
  $('wkTitle').textContent=`${label} · ${r.range.start.slice(5)} ~ ${r.range.end.slice(5)}`;
  $('wkNext').disabled=wkOffset>=0;
  const wTxt=r.wDiff==null?(r.wEnd!=null?`记录 ${r.wCount} 次，最近 ${r.wEnd} kg`:'本周未记录'):
    `${r.wStart} → ${r.wEnd} kg（${r.wDiff>0?'+':''}${r.wDiff} kg）`;
  $('reportBody').innerHTML=`
    <div class="report-card">
      <h3>📊 ${label}总结</h3>
      <div class="rng">${r.range.start} ~ ${r.range.end}</div>
      <div class="rp-grid">
        <div class="rp-cell"><div class="l">💰 总支出</div><div class="v">¥${r.total}</div><div class="s">${r.expCount} 笔消费</div></div>
        <div class="rp-cell"><div class="l">✅ 完成待办</div><div class="v">${r.doneCount} 项</div><div class="s">新增 ${r.newCount} 项</div></div>
        <div class="rp-cell"><div class="l">⚖️ 体重变化</div><div class="v">${r.wDiff==null?'--':(r.wDiff>0?'+':'')+(r.wDiff??'')+' kg'}</div><div class="s">${r.wEnd!=null?'周末 '+r.wEnd+' kg':'未记录'}</div></div>
        <div class="rp-cell"><div class="l">📖 英语学习</div><div class="v">${r.engDays} 天</div><div class="s">${r.engCount} 条记录</div></div>
      </div>
    </div>
    <div class="report-detail">
      <h4>💰 消费明细</h4>
      ${r.expCount?`共消费 <b>¥${r.total}</b>（${r.expCount} 笔）。最大三笔：<ul>${r.top.map(x=>`<li>${esc(x.note)} — ¥${x.amount}（${x.date.slice(5)}）</li>`).join('')}</ul>`:'本周没有消费记录。'}
      <h4>✅ 待办完成情况</h4>
      ${r.doneCount?`完成了 <b>${r.doneCount}</b> 项：<ul>${r.doneList.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join('')}${r.doneList.length>8?'<li>…等</li>':''}</ul>`:'本周没有完成待办事项。'}
      <h4>⚖️ 体重</h4>
      ${wTxt}${r.wDiff!=null?(r.wDiff<0?' 👏 有下降，继续保持！':r.wDiff>0?' 注意控制哦～':' 保持稳定。'):''}
      <h4>📖 英语学习</h4>
      ${r.engDays?`学习打卡 <b>${r.engDays}</b> 天、共 ${r.engCount} 条。最近记录：<ul>${r.engSample.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'本周没有学习记录，下周加油！'}
    </div>`;
}
$('wkPrev').onclick=()=>{wkOffset--;renderReport();};

/* 每周一 10:00 后自动生成上周报告提醒 */
function checkWeeklyReport(){
  const now=new Date();
  const lastWk=weekRange(-1);
  const key=lastWk.start; // 以上周一日期为报告 key
  const due=mondayOf(new Date());due.setHours(10,0,0,0); // 本周一 10:00
  if(now>=due&&!D.reports[key]){
    D.reports[key]=Object.assign({generatedAt:now.toISOString()},buildReport(-1));
    save();
    $('reportBanner').classList.add('show');
    $('rpDot').classList.add('show');
    setTimeout(()=>$('reportBanner').classList.remove('show'),15000);
  }
}

function drawPie(id,data){
  const cv=$(id),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total){ctx.fillStyle='#b7c1b6';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('暂无数据',W/2,H/2);return;}
  const cx=W/2,cy=H/2,r=Math.min(W,H)/2-14;
  let a=-Math.PI/2;
  data.forEach(d=>{const ang=d.value/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+ang);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();a+=ang;});
  ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#2b3a2b';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('¥'+round2(total),cx,cy);
}
$('mCatBtn').onclick=()=>{
  const mon=today().slice(0,7);
  const exp=D.expenses.filter(x=>x.date.slice(0,7)===mon);
  const totals={};CATS.forEach(c=>totals[c.key]=0);
  exp.forEach(x=>{totals[expCat(x).key]+=x.amount;});
  const total=exp.reduce((s,x)=>s+x.amount,0);
  $('pieSub').textContent= total? `${mon.replace('-','年')}月 · 共 ¥${round2(total)}` : '本月暂无支出';
  const rows=CATS.map(c=>({c,v:totals[c.key]||0})).filter(r=>r.v>0);
  $('pieLegend').innerHTML=rows.map(r=>`<div class="legend-row"><span class="dotc" style="background:${r.c.color}"></span><span class="nm">${r.c.icon} ${r.c.name}</span><span class="vl">¥${round2(r.v)}</span><span class="pc">${total?Math.round(r.v/total*100):0}%</span></div>`).join('')
    ||'<div class="legend-row"><span class="nm">本月暂无支出</span></div>';
  drawPie('pieCanvas',rows.map(r=>({value:r.v,color:r.c.color})));
  $('pieMask').classList.add('show');
};
